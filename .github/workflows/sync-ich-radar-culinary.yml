name: Sync ICH Radar Culinary Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */12 * * *"

jobs:
  sync-culinary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Foodways
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ICH-Radar data
        env:
          RADAR_DATA_URL: https://raw.githubusercontent.com/AnggaConni/ICH-Radar/main/data.json
        run: |
          python - <<'PY'
          import os, urllib.request
          url = os.environ["RADAR_DATA_URL"]
          urllib.request.urlretrieve(url, "ich_radar_data.json")
          print("Downloaded", os.path.getsize("ich_radar_data.json"), "bytes")
          PY

      - name: Build culinary dataset
        run: python radar_culinary_sync.py

      - name: Commit updated AI dataset
        run: |
          git config user.name "Foodways Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ai_culinary.json
          if git diff --cached --quiet; then
            echo "No culinary changes."
          else
            git commit -m "Sync culinary signals from ICH-Radar"
            git push
          fi
