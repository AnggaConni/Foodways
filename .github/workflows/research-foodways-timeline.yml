name: Research Foodways Timeline

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: "0 = all culinary records; use 3-5 for a cheap test run"
        required: false
        default: "0"
      force_run:
        description: "Run Python now even if the 4-day gate has not elapsed"
        required: false
        default: "false"
      force_research:
        description: "Ignore cache and research all selected records"
        required: false
        default: "false"
  schedule:
    # Run the workflow daily; a gate below lets Python actually run every 4 days.
    # Manual workflow_dispatch can bypass the 4-day gate with force_run=true.
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  timeline-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Foodways
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research SDKs
        run: python -m pip install --upgrade google-genai pydantic

      - name: Check 4-day gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RUN: ${{ inputs.force_run || 'false' }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            echo "run_python=true" >> "$GITHUB_OUTPUT"
            echo "Forced run requested."
            exit 0
          fi

          RUNS_JSON=$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/research-foodways-timeline.yml/runs?status=success&per_page=10")

          LAST_SUCCESS=$(python -c 'import json,sys; d=json.load(sys.stdin); rs=d.get("workflow_runs",[]); print(rs[0]["created_at"] if rs else "")' <<< "$RUNS_JSON")

          if [ -z "$LAST_SUCCESS" ]; then
            echo "run_python=true" >> "$GITHUB_OUTPUT"
            echo "No previous successful run found; running Python."
            exit 0
          fi

          python - <<'PY' "$LAST_SUCCESS"
          import sys
          from datetime import datetime, timezone
          last=datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))
          age=(datetime.now(timezone.utc)-last).total_seconds()/86400
          print(f"Days since last successful Python run: {age:.2f}")
          print("run_python="+("true" if age >= 4 else "false"))
          with open(__import__("os").environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write("run_python="+("true" if age >= 4 else "false")+"\n")
          PY

      - name: Run TinyFish + Gemini research
        if: steps.gate.outputs.run_python == 'true'
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          TIMELINE_MAX_RECORDS: ${{ inputs.max_records || '0' }}
          FORCE_TIMELINE_RESEARCH: ${{ inputs.force_research || '0' }}
          ENABLE_HUMAN_CROSSCHECK: "0"
        run: python timeline_research.py

      - name: Commit research dataset and cache
        run: |
          git config user.name "foodways-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add foodways_timeline_research.json foodways_timeline_cache.json
          if git diff --cached --quiet; then
            echo "No timeline changes."
          else
            git commit -m "Update Foodways timeline research"
            git push
          fi
